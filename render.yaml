# Render blueprint for the FastAPI backend.
#
# The frontend deploys to Vercel and the database is Supabase, so this file covers exactly
# one service. Secrets are marked sync:false — they are set in the Render dashboard and
# never live in the repository.

services:
  - type: web
    name: winchat-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio
    healthCheckPath: /healthz # liveness, not /readyz — see the Dockerfile note

    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # The Vercel origin. CORS is an allowlist, never "*", because credentials are sent.
      - key: CORS_ALLOW_ORIGINS
        sync: false

      # Render terminates TLS in front of the container, so X-Forwarded-For is set by a
      # proxy we control and can be trusted for rate-limit identity.
      - key: TRUST_PROXY_HEADERS
        value: "true"

      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false

      # Hosted, because an in-process model makes the image 920 MB against a 512 MB free
      # tier. MUST match what the corpus was ingested with — the stored vectors are
      # cohere/embed-v4.0/1024 and a query embedded by anything else retrieves confident
      # nonsense rather than raising. Changing either value here means a re-ingest.
      - key: EMBEDDING_PROVIDER
        value: cohere
      - key: COHERE_EMBED_MODEL
        value: embed-v4.0
      - key: COHERE_EMBED_DIMENSION
        value: "1024"

      - key: RERANK_PROVIDER
        value: cohere
      - key: RERANK_MODEL
        value: rerank-v3.5

      # One key, two roles: embeddings and reranking.
      - key: COHERE_API_KEY
        sync: false

      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false

      - key: RATE_LIMIT_SALT
        generateValue: true
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_GLOBAL_PER_DAY
        value: "2000"
