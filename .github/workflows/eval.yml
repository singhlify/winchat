name: Eval gate

# The quality gate. It runs the real pipeline against the golden set and fails the build
# when retrieval recall, faithfulness or correctness drop below their thresholds.
#
# Separate from CI on purpose:
#   * it needs secrets, so it cannot run on fork pull requests;
#   * it spends model tokens, so it should not run on every push to a branch;
#   * it is slow. Groq's free tier meters by tokens per minute, and the suite deliberately
#     waits that budget out rather than failing.
#
# Embeddings are hosted, so there is no service container and no model to pull. The
# invariant that mattered is unchanged: query embeddings must come from the same model the
# corpus was embedded with, because embedding a query with a different model than the index
# returns confident nonsense rather than an error. This job used to run Ollama as a service
# for exactly that reason; now it just has to name the same provider the corpus was
# ingested with. Getting it wrong is no longer silent. The index is 1024-dimensional and a
# 768-dimensional query is rejected by Postgres outright.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/eval.yml"
  schedule:
    - cron: "0 7 * * 1" # Mondays, to catch drift from corpus refreshes
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    # The credentials live in the `prod` environment rather than at repository level, so
    # the job has to name it. Environment secrets are injected only into jobs that do.
    # Without this line every secret below resolves to an empty string and the run fails
    # on a confusing auth error instead of a missing-secret one.
    #
    # It is also the better scoping: a workflow edited in some future pull request cannot
    # reach these keys unless it names the environment, and the environment can carry
    # approval or branch rules that repository secrets cannot.
    environment: prod
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: ci
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # One key, two roles: embeddings and reranking.
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      EMBEDDING_PROVIDER: cohere
      # The suite issues rerank calls back to back, which a trial key's 10-per-minute limit
      # will throttle. A reranker that gives up falls back to unranked order, so without a
      # budget long enough to wait the window out this job would quietly grade a pipeline
      # running without its reranker, worth 17 points of retrieval recall.
      RERANK_RETRY_BUDGET_S: "120"

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked

      - name: Run the eval suite
        run: uv run python -m winchat_api.evals.run --json eval-report.json

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: backend/eval-report.json
