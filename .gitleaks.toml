# gitleaks configuration.
#
# Starts from the full default rule set (~170 providers plus entropy-based generic rules)
# and narrows it as little as possible. Every allowlist entry below is a place a real
# credential could hide, so each one names what it exempts and why.
#
#   gitleaks git --staged .    # what is about to be committed (the pre-commit hook)
#   gitleaks git .             # every reachable commit
#   gitleaks dir .             # the working tree, including untracked files
#
# Run through ./scripts/scan_secrets.sh rather than directly — that wrapper also runs the
# dependency-free scanner, so the check still does something on a machine without gitleaks.

[extend]
useDefault = true

# gitleaks' `generic-api-key` rule is KEYWORD-anchored, not pure entropy: it wants a word
# like key / secret / token / password near the value. Probed against this exact config,
# a 45-character random string was detected next to `api_key`, `DB_PASSWORD`, `JWT_SECRET`
# and `SESSION_SIGNING_KEY` — and MISSED next to `SUPABASE_SERVICE_ROLE` and `salt`.
#
# Both misses are real variable names in this project. `RATE_LIMIT_SALT` is in `.env.example`
# and a Supabase service-role credential is the single most damaging thing that could leak
# here, because it bypasses Row Level Security entirely — the control the whole security
# story rests on. So the names this codebase actually uses get their own rule.
#
# Entropy gates it: `RATE_LIMIT_SALT=change-me` is documentation and scores far below 3.5,
# while a real random salt scores above it. The threshold is what keeps the example file
# quiet without a path exclusion.
[[rules]]
id = "winchat-project-secret"
description = "High-entropy value assigned to one of this project's secret-bearing names"
regex = '''(?i)\b(supabase[_-]?service[_-]?role|rate[_-]?limit[_-]?salt|jwt[_-]?signing|session[_-]?salt|anon[_-]?secret)[a-z_]*\s*[:=]\s*['"]?([A-Za-z0-9._+/=-]{20,})['"]?'''
secretGroup = 2
entropy = 3.5
keywords = [
    "supabase_service_role",
    "supabase-service-role",
    "rate_limit_salt",
    "rate-limit-salt",
    "jwt_signing",
    "session_salt",
    "anon_secret",
]

# Allowlists match on the SECRET VALUE, deliberately not on the file path.
#
# Path exclusions are the tempting fix and the wrong one: excluding
# `backend/tests/test_security.py` would silence today's false positive and also blind the
# scanner to a real key pasted into that file tomorrow. Exempting the specific known-fake
# string keeps the rest of the file under scrutiny.
[[allowlists]]
description = "HS256 test fixture — a self-describing fake, long only to stop PyJWT warning about key length in test output"
regexTarget = "match"
regexes = [
    '''test-secret-long-enough-for-hs256-[a-z]+''',
]

[[allowlists]]
description = "Placeholder values in committed example config. Real slots in .env.example are blank; these are documentation."
regexTarget = "match"
regexes = [
    '''change-me''',
    '''your-[a-z-]*key''',
    '''<[a-z-]+>''',
]
